spring.application.name=gerador.listas

# Configurações de Conexão com o MySQL
spring.datasource.url= SUA URL
spring.datasource.username=  SEU URSERNAME
spring.datasource.password= SUA SENHA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Hibernate para criar/atualizar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração do Spring AI
spring.ai.google.genai.api-key=SUA CHAVE DE API
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite